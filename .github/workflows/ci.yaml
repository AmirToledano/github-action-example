name: ci

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  docker-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/my-app:latest
            ${{ vars.DOCKERHUB_USERNAME }}/my-app:${{ github.run_number }}

      - name: Install Trivy CLI
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Print Trivy version
        run: trivy --version

      - name: Scan repository for vulnerabilities
        run: trivy fs . --severity HIGH,CRITICAL --exit-code 1

      - name: Send Slack notification
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_CHANNEL: pipeline-alerts
          SLACK_TITLE: Docker CI Pipeline Status
          SLACK_MESSAGE: The Docker build and push process has finished successfully!
          SLACK_COLOR: good
