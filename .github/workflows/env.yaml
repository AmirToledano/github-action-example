name: Secrets and Variables Pipeline

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  print-vars-and-secrets:
    runs-on: ubuntu-latest
    environment: production 

    steps:
      - name: Print Environment Variable
        run: echo "The current environment is ${{ vars.MY_ENVIRONMENT }}"

      - name: Print Secret
        run: echo "The secret user is ${{ secrets.JB_DEMO_USER }}"
